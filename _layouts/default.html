<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <nav class="breadcrumb">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      {% if page.url != "/" and page.title %}
      <span class="sep">/</span>
      <span class="page-title">{{ page.title }}</span>
      {% endif %}
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>월 · 수 · 금 09:00 KST 자동 갱신</p>
    <p><a href="https://github.com/ghkch5gh-jpg/ainews-curation">GitHub repo</a> · Built with Claude Code</p>
  </footer>
</body>
</html>
